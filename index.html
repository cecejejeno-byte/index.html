<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kawaii Cafe</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f5f3ee;
  font-family:Arial,sans-serif;
  color:#42404a;
}

.app{
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:auto;
  background:#fffafd;
  padding-bottom:90px;
}

/* HEADER */

.header{
  height:82px;
  padding:15px 25px;
  background:#fff;
  border-bottom:1px solid #f3dce8;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;

  color:#e767ac;
  font-size:20px;
  font-weight:bold;
}

.logo-box{
  width:52px;
  height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #f4d8e8;
  border-radius:17px;

  font-size:25px;
}

.cart-button{
  width:52px;
  height:52px;

  border:2px solid #f4d8e8;
  border-radius:17px;

  background:white;

  font-size:23px;
  cursor:pointer;
}

/* CONTENT */

.content{
  padding:28px 30px;
}

/* HERO */

.hero{
  height:185px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  border-radius:32px;

  background:linear-gradient(
    120deg,
    #ffd9ed,
    #fff0d9
  );
}

.hero h1{
  font-size:43px;
  color:#272d3a;
  margin-bottom:14px;
}

.hero p{
  font-size:18px;
  font-weight:bold;
  color:#74747d;
}

/* MOOD */

.moods{
  display:flex;
  gap:10px;

  margin:30px 0 35px;

  overflow-x:auto;
}

.mood{
  flex-shrink:0;

  padding:13px 21px;

  border:none;
  border-radius:30px;

  background:white;

  color:#77747e;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;
}
